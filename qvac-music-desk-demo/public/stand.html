<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Music Desk</title>
<link rel="stylesheet" href="stand.css">
</head>
<body>

<div class="sky" aria-hidden="true"><i></i><i></i><i></i><i></i></div>

<main class="stage">

  <div class="top">
    <div class="mark">
      <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true">
        <defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#FFC75F"/><stop offset=".5" stop-color="#FF4D9D"/><stop offset="1" stop-color="#B388FF"/>
        </linearGradient></defs>
        <path fill="url(#g1)" d="M15 1c7 0 14 5 14 13s-6 15-14 15S1 22 1 14 8 1 15 1z"/>
        <circle cx="12" cy="19" r="3.4" fill="#140D24"/><circle cx="21" cy="16" r="2.6" fill="#140D24"/>
        <path d="M15.4 19V9.6l7-1.6v2.2l-5 1.1V16" stroke="#140D24" stroke-width="1.8" fill="none" stroke-linecap="round"/>
      </svg>
      music desk
    </div>
    <span class="here"><b></b>Runs on this laptop</span>
  </div>

  <!-- The models are not on this machine yet. The only screen with a sentence on it. -->
  <section data-screen="setup" hidden>
    <h1>One download first</h1>
    <div class="note">
      <p id="setup-what"></p>
      <button class="go" id="fetch">Download</button>
    </div>
    <div class="foot"><span>Nothing is fetched without that click</span></div>
  </section>

  <!-- ================= BUILD ================= -->
  <section data-screen="build" hidden>
    <h1>Make a track in three picks</h1>

    <div class="step">
      <p class="steplab"><em>1</em> Style</p>
      <div class="row untouched" id="styles"></div>
    </div>

    <div class="step">
      <p class="steplab"><em>2</em> Mood</p>
      <div class="row" id="moods"></div>
    </div>

    <div class="step">
      <p class="steplab"><em>3</em> Instrument</p>
      <div class="row" id="instruments"></div>
    </div>

    <div class="built">
      <div class="head">
        <span class="lab">Your prompt</span>
        <span class="n" id="kwn"></span>
      </div>
      <span class="kw" id="kw" data-content></span>
    </div>

    <div class="make">
      <input id="typed" type="text" aria-label="Add your own words"
             placeholder="Your own words: sad, rainy, piano">
      <div class="seg" role="group" aria-label="Length">
        <button type="button" data-secs="30" aria-pressed="true">30s</button>
        <button type="button" data-secs="60" aria-pressed="false">60s</button>
      </div>
      <button class="go" id="go">Make it <small id="go-eta">11s</small></button>
    </div>

    <p class="err" id="build-err" hidden></p>

    <div class="foot">
      <span>ACE-Step 1.5 on the QVAC SDK</span>
      <img class="badge" src="assets/built-with-qvac-dark-mode-landscape-transparent.svg"
           alt="Built with QVAC" width="140" height="28">
    </div>
  </section>

  <!-- ================= MAKING ================= -->
  <section data-screen="cook" hidden>
    <div class="cook">
      <div class="pot" id="pot" aria-hidden="true"><i></i><i></i><i></i></div>
      <h2 id="cook-name"></h2>
      <p class="kwline" id="cook-kw"></p>
      <div class="track"><i id="track-fill"></i></div>
      <p class="steps" id="cook-steps"></p>
      <p class="eta" id="cook-eta"></p>
    </div>
    <div class="foot">
      <span></span>
      <button class="ghost" id="cancel">Cancel</button>
    </div>
  </section>

  <!-- ================= LISTEN ================= -->
  <section data-screen="listen" hidden>
    <div class="deck" id="deck">
      <div class="disc" id="disc">
        <span class="ring"></span><span class="ring"></span><span class="ring"></span>
        <span class="body"></span>
        <button class="play" id="play" aria-label="Pause">
          <svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true">
            <path id="play-path" fill="currentColor" d="M6 5h4v14H6zm8 0h4v14h-4z"/>
          </svg>
        </button>
      </div>
      <div class="nowmeta">
        <b id="now-name"></b>
        <span class="kw" id="now-kw" data-content></span>
        <svg class="ribbon" id="ribbon" viewBox="0 0 600 110" preserveAspectRatio="none" aria-hidden="true">
          <defs>
            <linearGradient id="rg" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0" stop-color="#3DDC97"/><stop offset=".45" stop-color="#4CC9F0"/>
              <stop offset=".75" stop-color="#B388FF"/><stop offset="1" stop-color="#FF7AC6"/>
            </linearGradient>
          </defs>
          <path id="rib2" fill="none" stroke="url(#rg)" stroke-width="2" opacity=".35" stroke-linecap="round"/>
          <path id="rib1" fill="none" stroke="url(#rg)" stroke-width="4" stroke-linecap="round"/>
        </svg>
        <div class="times"><span id="t-now">0:00</span><span id="t-end">0:00</span></div>
      </div>
    </div>

    <p class="thenlab">Then</p>
    <div class="then">
      <button class="card" id="act-restyle" style="--c1:#FFC75F;--c2:#FF4D9D">
        <b>Same song, new style</b><u>about 8s</u>
      </button>
      <button class="card" id="act-longer" style="--c1:#3DDC97;--c2:#4CC9F0">
        <b>Make it longer</b><u>about 12s</u>
      </button>
      <button class="card" id="act-again" style="--c1:#B388FF;--c2:#FF7AC6">
        <b>Another take</b><u>about 11s</u>
      </button>
    </div>
    <div class="row restyle" id="restyle" hidden></div>

    <p class="err" id="listen-err" hidden></p>

    <div class="foot">
      <a class="ghost" id="download" href="#" download>Download</a>
      <span class="footactions">
        <button class="ghost" id="stop">Stop the music</button>
        <button class="ghost" id="over">Start over</button>
      </span>
      <img class="badge" src="assets/built-with-qvac-dark-mode-landscape-transparent.svg"
           alt="Built with QVAC" width="140" height="28">
    </div>
  </section>

</main>

<audio id="audio" preload="auto" crossorigin="anonymous"></audio>
<script type="module" src="stand.js"></script>
</body>
</html>
