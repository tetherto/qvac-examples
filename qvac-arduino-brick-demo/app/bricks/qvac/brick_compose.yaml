services:
  qvac_runtime:
    build:
      context: ./runtime
    environment:
      HOST: 0.0.0.0
    user: node
    volumes:
      - qvac_models:/home/node/.qvac
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8765/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      start_period: 300s
      retries: 120

volumes:
  qvac_models:
